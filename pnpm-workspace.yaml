packages:
  - packages/*
  - apps/*
  - tools/*

# pnpm 11 blocks dependency build scripts unless they are listed here.
allowBuilds:
  # The webOS CLI (ares-*) makes its config files writable on Linux/macOS.
  '@webos-tools/cli': true
  # Only a donation banner.
  core-js: false
  # Optional native speed-ups for ssh2 (used by ares-* device commands); it falls back to pure JS.
  cpu-features: false
  # esbuild (pulled in by vitest/vite) runs a postinstall that verifies its native binary.
  esbuild: true
  ssh2: false
  # napi-postinstall check of the native binding; the bindings come as optional dependencies.
  unrs-resolver: false

overrides:
  # Windows Smart App Control (kept on) blocks unsigned native binaries it has no reputation
  # for. On 2026-11-02 it blocked unrs-resolver 1.13.0's resolver.win32-x64-msvc.node (published
  # 2026-10-31), which ESLint's import resolver, and so the boundary lint, needs. The 1.12.2
  # binary (2026-05) loads. Its wasm32 build is no fallback on Windows: WASI preopens only the
  # drive root and gets Windows paths, so every resolve fails. Linux CI is unaffected.
  # Lift the pin once a newer release loads under SAC (`pnpm lint` stays green locally).
  unrs-resolver: 1.12.2
  # subset-font (tools/fonts) asks for ^1.6.1; 1.6.4 was 12 days old when the fonts tool was
  # added (2026-11-03) and new dependencies must be two weeks old. Lift it with the next font change.
  harfbuzzjs: 1.6.3
