<!DOCTYPE html>
<!-- The playback harness under `pnpm dev` (RELAY step 18): http://localhost:5173/playback.html
     The desktop playback e2e drives it through window.__LABLO_PLAYBACK__ (src/playback/). The TV
     builds never include it: their entries are src/main.tsx and src/lab/lab-main.tsx. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Lablo playback harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="playback" data-testid="playback" data-state="idle">
      <div id="stage"></div>
      <!-- The subtitle overlay, where the player draws it (player.css). -->
      <div id="bottom" class="player__bottom"></div>
    </main>
    <script type="module" src="/src/playback/playback-main.ts"></script>
  </body>
</html>
