# The mock provider's catalog: our own test channels plus the Blender open movies (CC BY,
# credited at GET /attribution). No real channels, ever.
#
# Ids share one space across live channels, movies and episodes (like a panel's stream ids).
# live[].catchup is how the M3U advertises catch-up (xc, default, append, shift, flussonic);
# it only applies when archive_days > 0. Xtream clients always use /timeshift.
# live[].xmltv_id: the id in the XMLTV when it differs from epg_id (exercises EPG matching).
# media: which generated media plays (src/media-plan.ts, `pnpm mock:media`). Live: clock
# (default), bars, bilingual (ara + eng audio), hd (720p50), fhd (1080p25), radio (audio only,
# the default for radio channels). VOD and episodes: vod (default; subtitles ara + eng as SRT in
# MKV, mov_text in MP4), hevc-4k, multi-audio, open-movie:<key> (the Blender film once fetched
# with `pnpm mock:open-movies`, a labelled stand-in until then).

