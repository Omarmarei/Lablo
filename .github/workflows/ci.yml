name: CI

# Pull requests only (Omar 2026-11-05, CI minutes): the relay merges one pull request at a time
# into a main that hasn't moved, so a run on main after the merge tested the same code again.
# A full run of main or any branch: Actions -> CI -> Run workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request changes decides which jobs run: docs alone run none, the old engines run
  # when the TV bundles or their harness can change, media when the code it exercises does
  # (the mock, the data layer at scale, the player and the lab), and web when the backend or the
  # packages it shares with the TV do. A run by hand runs them all. A skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      engines: ${{ steps.diff.outputs.engines }}
      media: ${{ steps.diff.outputs.media }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'code=true\nengines=true\nmedia=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > changed.txt
          echo "Changed files:"; cat changed.txt
          # Not docs; then not tests either (what ends up in a build or a tool).
          grep -vE '\.md$|^docs/|^LICENSE' changed.txt > code.txt || true
          grep -vE '\.test\.tsx?$|^test/|^e2e/' code.txt > source.txt || true
          shared='^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/workflows/'
          engines="$shared|^apps/tv/|^packages/[^/]+/src/|^packages/crypto/test/|^tools/(engines|build|fonts)/"
          media="$shared|^apps/mock-provider/|^tools/(fixtures|bench)/|^packages/[^/]+/src/|^apps/tv/src/(player|lab|data)/|^apps/tv/(playback|lab)\.html$|^apps/tv/vite\.config\.ts$|^vitest\.media\.config\.ts$|^playwright\.config\.ts$"
          # The TV's pairing against the real API (e2e/pairing-api.spec.ts, step 31c3) runs the TV's
          # dev app and the mock: their sources and the spec's own files count too.
          web="$shared|^apps/(web|tv|mock-provider)/|^packages/(protocol|crypto)/|^packages/[^/]+/src/|^config/|^vitest\.web\.config\.ts$|^playwright\.web\.config\.ts$|^e2e/(pairing-api\.spec|api-front|pairing-steps|config-server|onboard|remote-driver|remote-keys)\.ts$|^tools/engines/src/(pair-phone|pair-server|pair-stand-in|config)\.ts$"
          hit() { if grep -qE "$1" "$2"; then echo true; else echo false; fi; }
          {
            echo "code=$(if [ -s code.txt ]; then echo true; else echo false; fi)"
            echo "engines=$(hit "$engines" source.txt)"
            if [ "$(hit "$media" source.txt)" = true ] || [ "$(hit '\.media\.test\.ts$|-media\.spec\.ts$' code.txt)" = true ]; then echo media=true; else echo media=false; fi
            echo "web=$(hit "$web" code.txt)"
          } | tee -a "$GITHUB_OUTPUT"

  # `pnpm verify` (lint, typecheck, unit tests, build:tv, e2e) in five parallel parts (RELAY step
  # 40ci): run one after another it took 17-22 min (e2e alone 12), and it set the run's length with
  # the engines. Each e2e shard builds the TV apps itself: tv-bundle, config-gate, lab and
  # crypto-vectors open dist/, and a build beside each shard is quicker than a build job before
  # them. So the build's gates (syntax, budgets, .ipk) run in both shards. `pnpm verify` stays the
  # one local command.
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: verify (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Lint and typecheck about 1 min, the unit tests 2, an e2e shard 9-10 with its build (step 40ci).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: lint
            timeout: 10
          - part: unit
            timeout: 15
          # Only the chromium project is sharded: Playwright never shards a project that another
          # one depends on (throttled depends on chromium), so a plain --shard ran all of chromium
          # in every shard.
          - part: e2e 1/2
            shard: 1
            timeout: 25
          - part: e2e 2/2
            shard: 2
            timeout: 25
          # The CPU-throttled timings (about 2.5 min, one worker) on a runner of their own: no
          # other browser competes for its CPU, as when they ran after the rest of pnpm e2e.
          - part: e2e throttled
            throttled: true
            timeout: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - if: matrix.part == 'lint'
        run: pnpm lint

      - if: matrix.part == 'lint'
        run: pnpm typecheck

      - if: matrix.part == 'unit'
        run: pnpm test

      # Chromium for the Playwright tests.
      - if: matrix.shard || matrix.throttled
        run: pnpm exec playwright install --with-deps chromium

      # The TV builds (syntax gate, budgets, .ipk), which the dist/ specs open.
      - if: matrix.shard
        run: pnpm build:tv

      - if: matrix.shard
        run: pnpm e2e --project=chromium --shard=${{ matrix.shard }}/2

      # They build their catalogs in the spec: no dist/.
      - if: matrix.throttled
        run: pnpm e2e --project=throttled --no-deps

      - name: Upload the TV builds
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: tv-builds
          path: |
            dist/tv/
            dist/packages/
          if-no-files-found: ignore
          retention-days: 14

      # The component gallery in en, ar and en-XA (e2e/gallery.spec.ts, RELAY step 11b), and the
      # other specs' screenshots, from each shard.
      - name: Upload the screenshots
        if: always() && matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: gallery-screenshots-${{ matrix.shard }}
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the Playwright report
        if: failure() && (matrix.shard || matrix.throttled)
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard || 'throttled' }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Old-engine harness (RELAY steps 2b and 11c, docs/runbooks/old-engines.md): the built TV
  # apps in Chromium 53/56/68 snapshots under Docker, the hello screen and the component
  # gallery, plus the self-test that seeded ES2018/ES2020 syntax, a build without polyfills and
  # two seeded CSS breakages are caught. Separate job so `verify` stays fast.
  # One job per engine (RELAY step 40ci): the three one after another took 25 min. Each runs its
  # engine's seeded variants too (--self-test): whether a seed must fail depends on the engine
  # (mustPass), and the seeds are about half of each engine's time. A flaky Chromium 53 run
  # reruns alone (`gh run rerun --failed`).
  engines:
    needs: changes
    if: needs.changes.outputs.engines == 'true'
    name: engines (${{ matrix.engine }})
    # The engines run inside a pinned Debian 9 container, so the host image barely matters;
    # pinned anyway (ubuntu-latest moves to 26.04).
    runs-on: ubuntu-24.04
    # On PR #180's run (step 40ci): Chromium 53 took 8 min, 56 9.3 and 68 6.3, with their seeds;
    # set up and build:tv add about 2.5.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome53, chrome56, chrome68]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The job's pinned Chromium snapshot (about 95 MB of the three's 280; the harness downloads
      # only the engines it runs); the key changes when an engine changes.
      - name: Cache the Chromium snapshot
        uses: actions/cache@v6
        with:
          path: .cache/engines
          key: engines-${{ matrix.engine }}-${{ hashFiles('tools/engines/src/engines.ts') }}

      - run: pnpm build:tv --skip-package

      - run: pnpm verify:engines --self-test --engine ${{ matrix.engine }}

      # The report, and the component gallery (RELAY step 11c), onboarding's form and done
      # screens (step 13c) and the pairing screen's code and done views (step 31c2b) as the
      # engine drew them.
      - name: Upload the old-engine report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: old-engines-report-${{ matrix.engine }}
          path: |
            artifacts/engines/report.json
            artifacts/engines/gallery-*.png
            artifacts/engines/onboarding-*.png
            artifacts/engines/pairing-*.png
            artifacts/engines/backup-*.png
            artifacts/engines/lab-logs/
          if-no-files-found: ignore
          retention-days: 14

  # The backend (RELAY step 29a, docs/runbooks/web.md): every migration on an empty Postgres 17
  # (pnpm test:web drops, creates and migrates `lablo_test`, then checks it against schema.prisma,
  # the Prisma client and GET /v1/health), then `next build`, then the phone page in Chromium
  # against `next start` (pnpm e2e:web, RELAY step 31b: a fresh `lablo_e2e`), and the TV's pairing
  # screen in its dev app against the same server (step 31c3). Lint, typecheck and the unit tests
  # run in `verify`. The service trusts the runner's connections: no password exists anywhere.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lablo
          POSTGRES_DB: lablo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U lablo -d lablo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://lablo@127.0.0.1:54329/lablo
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Its postinstall generates the Prisma client (apps/web/src/generated, gitignored).
      - run: pnpm install --frozen-lockfile

      - run: pnpm test:web

      - run: pnpm build:web

      # Chromium for the Playwright specs (apps/web/e2e, e2e/pairing-api.spec.ts).
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e:web

      # The phone page and the TV's pairing screen in en and ar (apps/web/e2e/phone.spec.ts,
      # e2e/pairing-api.spec.ts), and the report when it fails.
      - name: Upload the phone page's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots
          path: |
            artifacts/screenshots/phone-*.png
            artifacts/screenshots/pair-api-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the phone page's Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-web-report
          path: |
            artifacts/playwright-web-report/
            artifacts/playwright-web-results/
          if-no-files-found: ignore
          retention-days: 14

  # Legal media set and scale fixtures (RELAY step 4, docs/runbooks/mock-provider.md "Media"):
  # ffmpeg generates the test channels and files, ffprobe validates what the mock serves, and the
  # 200k catalog plus the 50/150/300 MB XMLTV must generate in under 2 minutes. Then the
  # benchmark baselines, and the mock's Docker image is built and probed.
  media:
    needs: changes
    if: needs.changes.outputs.media == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not preinstalled on the runner image; Ubuntu's build has libx264/libx265/drawtext.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -n 1

      # Assets are cached by a hash of their ffmpeg arguments, so a restored cache only
      # re-encodes what changed.
      - name: Cache the generated media
        uses: actions/cache@v6
        with:
          path: .cache/media
          key: media-${{ hashFiles('apps/mock-provider/src/media-plan.ts', 'apps/mock-provider/src/media-gen.ts', 'apps/mock-provider/fixtures/catalog.yaml') }}
          restore-keys: media-

      # Chromium for pnpm lab:media (S5, the lab's <video> battery, on the generated media).
      - run: pnpm exec playwright install --with-deps chromium

      # pnpm fixtures (fails over 2 minutes) + pnpm test:media (ffprobe on everything served)
      # + pnpm lab:media (RELAY step 15c) + pnpm e2e:media (live, VOD and catch-up through
      # Html5Engine and the PlayerController, step 18).
      - run: pnpm verify:media

      - name: Benchmark baselines
        run: pnpm bench --iterations 2 --json artifacts/bench.json

      - name: Build and probe the mock's Docker image
        run: |
          docker build -f apps/mock-provider/Dockerfile -t lablo-mock:ci .
          docker run -d --name lablo-mock -p 18080:8080 lablo-mock:ci --no-lab-logs
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/__mock/health && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/__mock/health | grep -q '"media":"files"'
          ffprobe -v error -show_streams -of compact http://127.0.0.1:18080/live/lablo/lablo-test/104.ts | grep -c codec_type=audio | grep -qx 2
          docker rm -f lablo-mock

      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: artifacts/bench.json
          if-no-files-found: ignore
          retention-days: 14
