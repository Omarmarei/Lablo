name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium for the Playwright smoke tests (pnpm e2e, part of pnpm verify).
      - run: pnpm exec playwright install --with-deps chromium

      # lint + typecheck + unit tests + TV builds (syntax gate, budgets, .ipk) + Playwright.
      - run: pnpm verify

      - name: Upload the TV builds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tv-builds
          path: |
            dist/tv/
            dist/packages/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
