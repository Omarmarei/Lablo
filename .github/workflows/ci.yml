name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium for the Playwright smoke tests (pnpm e2e, part of pnpm verify).
      - run: pnpm exec playwright install --with-deps chromium

      # lint + typecheck + unit tests + TV builds (syntax gate, budgets, .ipk) + Playwright.
      - run: pnpm verify

      - name: Upload the TV builds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tv-builds
          path: |
            dist/tv/
            dist/packages/
          if-no-files-found: ignore
          retention-days: 14

      # The component gallery in en, ar and en-XA (e2e/gallery.spec.ts, RELAY step 11b).
      - name: Upload the gallery screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Old-engine harness (RELAY steps 2b and 11c, docs/runbooks/old-engines.md): the built TV
  # apps in Chromium 53/56/68 snapshots under Docker, the hello screen and the component
  # gallery, plus the self-test that seeded ES2018/ES2020 syntax, a build without polyfills and
  # two seeded CSS breakages are caught. Separate job so `verify` stays fast.
  engines:
    # The engines run inside a pinned Debian 9 container, so the host image barely matters;
    # pinned anyway (ubuntu-latest moves to 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ~280 MB of pinned Chromium snapshots; the key changes when an engine changes.
      - name: Cache the Chromium snapshots
        uses: actions/cache@v6
        with:
          path: .cache/engines
          key: engines-${{ hashFiles('tools/engines/src/engines.ts') }}

      - run: pnpm build:tv --skip-package

      - run: pnpm verify:engines --self-test

      # The report, and the component gallery (RELAY step 11c) and onboarding's form and done
      # screens (step 13c) as each engine drew them.
      - name: Upload the old-engine report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: old-engines-report
          path: |
            artifacts/engines/report.json
            artifacts/engines/gallery-*.png
            artifacts/engines/onboarding-*.png
            artifacts/engines/lab-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Legal media set and scale fixtures (RELAY step 4, docs/runbooks/mock-provider.md "Media"):
  # ffmpeg generates the test channels and files, ffprobe validates what the mock serves, and the
  # 200k catalog plus the 50/150/300 MB XMLTV must generate in under 2 minutes. Then the
  # benchmark baselines, and the mock's Docker image is built and probed.
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not preinstalled on the runner image; Ubuntu's build has libx264/libx265/drawtext.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -n 1

      # Assets are cached by a hash of their ffmpeg arguments, so a restored cache only
      # re-encodes what changed.
      - name: Cache the generated media
        uses: actions/cache@v6
        with:
          path: .cache/media
          key: media-${{ hashFiles('apps/mock-provider/src/media-plan.ts', 'apps/mock-provider/src/media-gen.ts', 'apps/mock-provider/fixtures/catalog.yaml') }}
          restore-keys: media-

      # pnpm fixtures (fails over 2 minutes) + pnpm test:media (ffprobe on everything served).
      - run: pnpm verify:media

      - name: Benchmark baselines
        run: pnpm bench --iterations 2 --json artifacts/bench.json

      - name: Build and probe the mock's Docker image
        run: |
          docker build -f apps/mock-provider/Dockerfile -t zoma-mock:ci .
          docker run -d --name zoma-mock -p 18080:8080 zoma-mock:ci --no-lab-logs
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/__mock/health && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/__mock/health | grep -q '"media":"files"'
          ffprobe -v error -show_streams -of compact http://127.0.0.1:18080/live/zoma/zoma-test/104.ts | grep -c codec_type=audio | grep -qx 2
          docker rm -f zoma-mock

      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: artifacts/bench.json
          if-no-files-found: ignore
          retention-days: 14
